name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        default: 'fox_12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        default: 'https://github.com/qzj112223/device_huawei_mrr_w29'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        default: 'main'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        default: 'device/huawei/mrr_w29'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL（可以不填）'
        default: ''
      COMMON_PATH:
        description: 'COMMON_PATH（可以不填）'
        default: ''
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        default: 'mrr_w29'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        default: 'omni_mrr_w29'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        default: 'recovery'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Prepare Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git repo rsync openssl python3 python3-pip

      - name: Sync OrangeFox Source
        run: |
          mkdir -p workspace
          cd workspace
          repo init -u ${{ github.event.inputs.SYNC_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }} --depth=1
          repo sync -c --no-tags --optimized-fetch --force-sync -j$(nproc --all)

      - name: Clone Device Tree
        run: |
          cd workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          rm -rf device/huawei/mrr_w29
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}

      - name: Build Recovery
        run: |
          cd workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          source build/envsetup.sh
          lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
          make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            workspace/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
          name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_number }}
          tag_name: ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
