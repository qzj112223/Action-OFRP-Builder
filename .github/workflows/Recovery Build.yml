name: Orange Fox Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git repo rsync python3 python3-pip cpio gzip

      - name: Sync Source
        run: |
          cd /home/runner
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          chmod +x orangefox_sync.sh
          ./orangefox_sync.sh --branch 12.1 --path /home/runner/fox_12.1
          echo "SYNC_DONE"

      - name: Find Source
        run: |
          echo "=== 搜索 fox 目录 ==="
          find /home/runner -maxdepth 2 -type d -name "fox*" 2>/dev/null
          echo "=== 搜索 build/envsetup ==="
          find /home/runner -maxdepth 4 -name "envsetup.sh" -path "*/build/*" 2>/dev/null

      - name: Clone Device Tree
        run: |
          SRC=$(find /home/runner -maxdepth 3 -name "envsetup.sh" -path "*/build/*" 2>/dev/null | head -1 | sed 's|/build/envsetup.sh||')
          echo "SRC=$SRC"
          cd "$SRC"
          rm -rf device/huawei/mrr_w29
          git clone https://github.com/qzj112223/device_huawei_mrr_w29 -b main device/huawei/mrr_w29
          echo "DEVICE_CLONED"

      - name: Build
        run: |
          SRC=$(find /home/runner -maxdepth 3 -name "envsetup.sh" -path "*/build/*" 2>/dev/null | head -1 | sed 's|/build/envsetup.sh||')
          cd "$SRC"
          source build/envsetup.sh
          lunch omni_mrr_w29-eng
          make recoveryimage -j$(nproc --all)

      - name: Upload
        uses: softprops/action-gh-release@v1
        with:
          files: |
            recovery.img
          name: mrr_w29-OFRP
          tag_name: build-${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find Output
        if: failure()
        run: |
          find /home/runner -name "*.img" -size +10M 2>/dev/null | head -10
