name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH'
        default: '12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        default: 'https://github.com/qzj112223/device_huawei_mrr_w29'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        default: 'main'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        default: 'device/huawei/mrr_w29'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        default: 'mrr_w29'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME'
        default: 'omni_mrr_w29'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        default: 'recovery'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    env:
      WORK_DIR: /home/runner/fox_12.1
    steps:
      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Prepare
        run: |
          sudo apt-get update
          sudo apt-get install -y git repo rsync openssl python3 python3-pip

      - name: Sync OrangeFox Source
        run: |
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          chmod +x orangefox_sync.sh
          ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path $WORK_DIR

      - name: Clone Device Tree
        run: |
          cd $WORK_DIR
          rm -rf ${{ github.event.inputs.DEVICE_PATH }}
          git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}

      - name: Build Recovery
        run: |
          cd $WORK_DIR
          source build/envsetup.sh
          lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
          make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            /home/runner/fox_12.1/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ github.event.inputs.BUILD_TARGET }}.img
          name: OFRP-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_number }}
          tag_name: ${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
